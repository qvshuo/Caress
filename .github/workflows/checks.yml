name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Check version consistency
        run: |
          python - <<'PYVERSION'
          import ast, json, re
          from pathlib import Path
          tree = ast.parse(Path('caress/__init__.py').read_text())
          version = next(ast.literal_eval(node.value) for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets))
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          assert json.loads(Path('caress/web/package.json').read_text())['version'] == version
          assert f'image: caress:{version}\n' in Path('docker-compose.example.yml').read_text()
          PYVERSION
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check caress tests --no-cache
      - run: python -m pytest tests -q --basetemp="${RUNNER_TEMP}/caress-tests"
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Prepare isolated frontend workspace
        run: cp -a caress/web "${RUNNER_TEMP}/caress-web"
      - name: Install, typecheck and build
        working-directory: ${{ runner.temp }}/caress-web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Install browser
        working-directory: ${{ runner.temp }}/caress-web
        run: bun x playwright install --with-deps chromium
      - name: Browser regression
        working-directory: ${{ runner.temp }}/caress-web
        run: bun run test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and start fresh database through Compose
        run: |
          cat > "${RUNNER_TEMP}/caress-compose.yml" <<EOF
          services:
            caress:
              build:
                context: ${GITHUB_WORKSPACE}
              image: caress:ci
              ports:
                - "127.0.0.1:9308:9307"
          EOF
          docker compose -p caress-ci -f "${RUNNER_TEMP}/caress-compose.yml" up -d --build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:9308/api/health
          docker compose -p caress-ci -f "${RUNNER_TEMP}/caress-compose.yml" restart
          docker compose -p caress-ci -f "${RUNNER_TEMP}/caress-compose.yml" up -d --wait --wait-timeout 120
          curl --fail http://127.0.0.1:9308/api/health
      - name: Container logs and cleanup
        if: always()
        run: |
          docker compose -p caress-ci -f "${RUNNER_TEMP}/caress-compose.yml" logs --no-color
          docker compose -p caress-ci -f "${RUNNER_TEMP}/caress-compose.yml" down
