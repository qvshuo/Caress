name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import ast, json, os
          from pathlib import Path
          tree = ast.parse(Path('caress/__init__.py').read_text())
          version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets))
          assert os.environ['TAG'] == f'v{version}'
          assert json.loads(Path('caress/web/package.json').read_text())['version'] == version
          PY
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --title "Caress $TAG" --generate-notes
