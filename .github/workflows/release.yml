name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import ast, json, os
          from pathlib import Path
          from xml.etree import ElementTree
          plugin = ElementTree.parse("emby-plugin/caress/caress.csproj").findtext("PropertyGroup/Version")
          web = json.loads(Path("caress/web/package.json").read_text())["version"]
          module = ast.parse(Path("caress/__init__.py").read_text())
          backend = next(ast.literal_eval(node.value) for node in module.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets))
          assert os.environ["TAG"] == f"v{plugin}" and plugin == web == backend, "Version mismatch"
          PYTHON
      - name: Build plugin
        run: |
          cat > "$RUNNER_TEMP/compose.yml" <<EOF_COMPOSE
          services:
            plugin:
              image: caress-plugin-release
              entrypoint: /caress.dll
              build:
                context: $GITHUB_WORKSPACE
                dockerfile: emby-plugin/Dockerfile
          EOF_COMPOSE
          docker compose -f "$RUNNER_TEMP/compose.yml" build plugin
          docker compose -f "$RUNNER_TEMP/compose.yml" create plugin
          docker compose -f "$RUNNER_TEMP/compose.yml" cp plugin:/caress.dll ./Caress.dll
          docker compose -f "$RUNNER_TEMP/compose.yml" down
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" Caress.dll --verify-tag --title "Caress $TAG" --generate-notes
