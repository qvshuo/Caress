services:
  caress:
    image: caress:1.7.0
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:9307:9307"
    volumes:
      - /path/to/caress-data:/data # 设置和处理记录；无需挂载媒体目录
    environment:
      TZ: Asia/Shanghai
    stop_grace_period: 45s
    depends_on:
      flaresolverr:
        condition: service_healthy
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /path/to/caress-data/flaresolverr:/config
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8191/]
      interval: 5s
      timeout: 5s
      retries: 10
