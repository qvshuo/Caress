services:
  caress:
    image: caress:1.6.2
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:9307:9307"
    volumes:
      - /path/to/media:/path/to/media:ro # 改为视频、STRM 所在的实际目录
      - /path/to/data:/data # 改为数据目录，SQLite 和图片保存在此目录
    environment:
      TZ: Asia/Shanghai
    depends_on:
      flaresolverr:
        condition: service_healthy
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /path/to/data/flaresolverr:/config
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8191/
      interval: 5s
      timeout: 5s
      retries: 10
